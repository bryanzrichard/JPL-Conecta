<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPL Conecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Initialize theme and primary color
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          if (!savedTheme) localStorage.setItem('theme', 'dark');
        }
        
        const primaryColor = localStorage.getItem('primary-color') || '#6366f1';
        document.documentElement.style.setProperty('--primary', primaryColor);
        // Calculate a darker version for hover (simplified)
        document.documentElement.style.setProperty('--primary-hover', primaryColor); 
      })();

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand': {
                'primary': 'var(--primary)',
                'primary-hover': 'var(--primary-hover)',
              },
              'brand-blue': {
                '500': 'var(--primary)',
                '600': 'var(--primary-hover)',
              },
              'brand-dark': {
                '50': '#f9fafb',
                '100': '#f3f4f6',
                '200': '#e5e7eb',
                '300': '#d1d5db',
                '400': '#9ca3af',
                '500': '#6b7280',
                '600': '#4b5563',
                '700': '#374151',
                '800': '#1f2937',
                '900': '#111827',
                '950': '#0d111d'
              }
            }
          }
        }
      }
    </script>
    <style>
            :root {
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --bg-main: #ffffff;
                --text-main: #111827;
                --bg-card: #ffffff;
                --border-main: #e5e7eb;
            }

            .dark {
                --bg-main: #0d111d;
                --text-main: #ffffff;
                --bg-card: #111827;
                --border-main: #1f2937;
            }
            
            body {
                background-color: var(--bg-main);
                color: var(--text-main);
            }

            /* ======================================================== */
            /* TEMA CLARO (Light Theme) OVERRIDES                       */
            /* Ativado quando a classe 'dark' NÃO está no <html>        */
            /* ======================================================== */
            html:not(.dark) body {
                background-color: #f8fafc !important;
                color: #0f172a !important;
            }

            /* Superfícies e Containers */
            html:not(.dark) .bg-brand-dark-950 {
                background-color: #f8fafc !important;
                color: #0f172a !important;
            }
            html:not(.dark) .bg-brand-dark-950\/50,
            html:not(.dark) .bg-brand-dark-950\/40 {
                background-color: rgba(241, 245, 249, 0.75) !important;
            }

            html:not(.dark) .bg-brand-dark-900 {
                background-color: #ffffff !important;
                color: #0f172a !important;
            }
            html:not(.dark) .bg-brand-dark-900\/95,
            html:not(.dark) .bg-brand-dark-900\/90,
            html:not(.dark) .bg-brand-dark-900\/80,
            html:not(.dark) .bg-brand-dark-900\/50 {
                background-color: rgba(255, 255, 255, 0.95) !important;
                color: #0f172a !important;
            }

            html:not(.dark) .bg-brand-dark-800,
            html:not(.dark) .bg-brand-dark-800\/80,
            html:not(.dark) .bg-brand-dark-800\/60,
            html:not(.dark) .bg-brand-dark-800\/40 {
                background-color: #f1f5f9 !important;
                color: #0f172a !important;
            }

            html:not(.dark) .bg-gray-900,
            html:not(.dark) .bg-gray-900\/80,
            html:not(.dark) .bg-gray-900\/60,
            html:not(.dark) .bg-gray-900\/40,
            html:not(.dark) .bg-gray-900\/30 {
                background-color: #f8fafc !important;
            }

            html:not(.dark) .bg-gray-800,
            html:not(.dark) .bg-gray-800\/60,
            html:not(.dark) .bg-gray-800\/50,
            html:not(.dark) .bg-gray-800\/40,
            html:not(.dark) .bg-gray-800\/30 {
                background-color: #f1f5f9 !important;
            }

            /* Bordas e Divisores */
            html:not(.dark) .border-gray-800,
            html:not(.dark) .border-gray-800\/80,
            html:not(.dark) .border-gray-800\/60,
            html:not(.dark) .border-gray-800\/50 {
                border-color: #e2e8f0 !important;
            }
            html:not(.dark) .border-gray-700,
            html:not(.dark) .border-gray-700\/50 {
                border-color: #cbd5e1 !important;
            }
            html:not(.dark) .divide-gray-800 > :not([hidden]) ~ :not([hidden]) {
                border-color: #e2e8f0 !important;
            }

            /* Textos e Tipografia */
            html:not(.dark) .text-white {
                color: #0f172a !important;
            }
            html:not(.dark) .text-gray-100,
            html:not(.dark) .text-gray-200,
            html:not(.dark) .text-gray-300 {
                color: #334155 !important;
            }
            html:not(.dark) .text-gray-400 {
                color: #64748b !important;
            }
            html:not(.dark) .text-gray-500 {
                color: #64748b !important;
            }

            /* Exceções Obrigatórias: botões de ação e badges primários mantêm texto branco */
            html:not(.dark) button.bg-brand-blue-600,
            html:not(.dark) button.bg-brand-blue-500,
            html:not(.dark) button.bg-red-600,
            html:not(.dark) .bg-brand-blue-600,
            html:not(.dark) .bg-brand-blue-500,
            html:not(.dark) .bg-red-600,
            html:not(.dark) .bg-brand-blue-600 .text-white,
            html:not(.dark) .bg-brand-blue-500 .text-white,
            html:not(.dark) .bg-red-600 .text-white,
            html:not(.dark) .bg-emerald-600 .text-white,
            html:not(.dark) a.bg-brand-blue-600,
            html:not(.dark) a.bg-brand-blue-500 {
                color: #ffffff !important;
            }

            /* Inputs, Selects e Textareas */
            html:not(.dark) input:not([type=checkbox]):not([type=radio]):not([type=file]),
            html:not(.dark) select,
            html:not(.dark) textarea {
                background-color: #ffffff !important;
                border-color: #cbd5e1 !important;
                color: #0f172a !important;
            }
            html:not(.dark) input::placeholder,
            html:not(.dark) textarea::placeholder {
                color: #94a3b8 !important;
            }

            /* Linhas de Tabela */
            html:not(.dark) tr.hover\:bg-gray-800\/50:hover,
            html:not(.dark) tr.hover\:bg-gray-800\/40:hover,
            html:not(.dark) tr.hover\:bg-gray-800\/30:hover,
            html:not(.dark) tr.hover\:bg-brand-dark-950\/50:hover {
                background-color: #f8fafc !important;
            }
            html:not(.dark) thead.bg-gray-800\/50,
            html:not(.dark) thead.bg-brand-dark-950\/50 {
                background-color: #f1f5f9 !important;
                color: #475569 !important;
            }

            /* Dropdowns, Popovers e Menus */
            html:not(.dark) [role="dialog"],
            html:not(.dark) [role="menu"],
            html:not(.dark) .shadow-2xl,
            html:not(.dark) .shadow-xl {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04) !important;
            }

            /* Calendário DayPicker no tema claro */
            html:not(.dark) .rdp {
                --rdp-background-color: #ffffff;
                --rdp-color: #1e293b;
                border-color: #e2e8f0;
            }
            html:not(.dark) .rdp-head_cell {
                color: #64748b;
            }
            html:not(.dark) .rdp-button:hover:not([disabled]):not(.rdp-day_selected) {
                background-color: #f1f5f9;
            }

            /* Skeletons e Hovers no tema claro */
            html:not(.dark) .animate-pulse {
                background-color: #e2e8f0 !important;
            }
            html:not(.dark) .hover\:text-white:hover {
                color: #0f172a !important;
            }
            html:not(.dark) .hover\:bg-brand-dark-800:hover,
            html:not(.dark) .hover\:bg-brand-dark-800\/60:hover,
            html:not(.dark) .hover\:bg-brand-dark-700:hover,
            html:not(.dark) .hover\:bg-gray-800:hover,
            html:not(.dark) .hover\:bg-gray-700:hover {
                background-color: #f1f5f9 !important;
            }
            
            /* Safe area insets for mobile */
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .pt-safe {
                padding-top: env(safe-area-inset-top);
            }
            
            /* react-day-picker v9 styles */
            .rdp {
                --rdp-cell-size: 36px;
                --rdp-caption-font-size: 14px;
                --rdp-background-color: #111827; /* gray-900 */
                --rdp-accent-color: #0ea5e9; /* sky-500 */
                --rdp-color: #d1d5db; /* gray-300 */
                --rdp-border-radius: 6px;
                --rdp-outline: 2px solid var(--rdp-accent-color);
                --rdp-outline-selected: 3px solid var(--rdp-accent-color);
                border: 1px solid #374151; /* gray-700 */
                color: var(--rdp-color);
                background-color: var(--rdp-background-color);
                border-radius: var(--rdp-border-radius);
                padding: 0.5rem;
                margin: 1em 0;
            }
            .rdp-button:hover:not([disabled]):not(.rdp-day_selected) {
                background-color: #374151; /* gray-700 */
            }
            .rdp-day_today { 
                font-weight: bold; 
                color: var(--rdp-accent-color);
            }
            .rdp-day_selected, .rdp-day_selected:hover { 
                color: white; 
                background-color: var(--rdp-accent-color);
                font-weight: bold;
            }
            .rdp-day_outside {
                opacity: 0.3;
            }
            .rdp-caption_label {
                font-size: var(--rdp-caption-font-size);
                font-weight: bold;
            }
            .rdp-head_cell {
                font-size: 0.75rem;
                color: #9ca3af; /* gray-400 */
                text-transform: uppercase;
            }
            .rdp-day_range_start, .rdp-day_range_end {
                color: white !important;
                background-color: var(--rdp-accent-color) !important;
            }
            .rdp-day_range_middle {
                background-color: rgba(14, 165, 233, 0.2) !important; /* sky-500 with opacity */
                border-radius: 0;
                color: white !important;
            }

            /* Custom Scrollbar */
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: transparent;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #374151; /* gray-700 */
                border-radius: 10px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #4b5563; /* gray-600 */
            }
            
            /* Ensure inherit max-height works */
            .max-h-inherit {
                max-height: inherit;
            }
    </style>

</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
